name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate through the reusable action
        uses: ./
        with:
          profile: profiles/findmate-owner.public.json
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile scripts
        run: |
          python3 -m py_compile skills/find-complementary-founders/scripts/*.py
          python3 -m py_compile growth/measure.py
          python3 -m py_compile examples/run_synthetic_demo.py
          python3 -m py_compile tools/build_skill_archive.py
      - name: Build the portable skill archive
        run: |
          python3 tools/build_skill_archive.py \
            --output /tmp/find-complementary-founders.skill.zip \
            --checksum-output /tmp/find-complementary-founders.skill.zip.sha256
          python3 tools/build_skill_archive.py \
            --verify /tmp/find-complementary-founders.skill.zip
      - name: Validate the canonical public profile
        run: |
          python3 skills/find-complementary-founders/scripts/validate_profile.py \
            profiles/findmate-owner.public.json
      - name: Validate skill metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("skills/find-complementary-founders/SKILL.md")
          text = path.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not match:
              raise SystemExit("Missing YAML frontmatter")
          lines = match.group(1).splitlines()
          keys = [line.split(":", 1)[0] for line in lines if ":" in line]
          if keys != ["name", "description", "license"]:
              raise SystemExit(f"Unexpected frontmatter keys: {keys}")
          if "name: find-complementary-founders" not in match.group(1):
              raise SystemExit("Skill name does not match its directory")
          if "license: MIT" not in match.group(1):
              raise SystemExit("Skill must declare its bundled MIT license")
          if len(text.splitlines()) > 500:
              raise SystemExit("SKILL.md exceeds 500 lines")
          PY
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact site dependencies
        run: npm ci
      - name: Build and verify the owner-facing site
        run: npm test
      - name: Lint the site
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev
