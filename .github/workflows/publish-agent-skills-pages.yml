name: Publish Agent Skills discovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-agent-skills-pages.yml"
      - "site/package-lock.json"
      - "site/package.json"
      - "site/scripts/build-agent-skill-discovery.mjs"
      - "skills/find-complementary-founders/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: findmate-agent-skills-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact discovery dependencies
        working-directory: site
        run: npm ci
      - name: Build the digest-bound discovery archive
        working-directory: site
        run: npm run prebuild
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the bounded static endpoint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-root/.well-known/agent-skills"
          cp site/public/.well-known/agent-skills/index.json \
            "$RUNNER_TEMP/pages-root/.well-known/agent-skills/index.json"
          cp site/public/.well-known/agent-skills/find-complementary-founders.zip \
            "$RUNNER_TEMP/pages-root/.well-known/agent-skills/find-complementary-founders.zip"
          tar \
            --directory "$RUNNER_TEMP/pages-root" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .
      - name: Upload the bounded static endpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Agent Skills discovery
        id: deployment
        uses: actions/deploy-pages@v4
