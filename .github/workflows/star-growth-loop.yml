name: Ethical star growth loop

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: findmate-star-growth-loop
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Measure aggregate growth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 growth/measure.py --output growth-status.json
      - name: Update the single public growth ledger
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const status = JSON.parse(fs.readFileSync("growth-status.json", "utf8"));
            const observationLog = JSON.parse(
              fs.readFileSync("growth/observations.json", "utf8")
            );
            const observations = observationLog.observations.slice(-3);
            const promotion = status.promotion;
            const active = status.experiments.filter(
              (item) => item.effective_status === "active"
            );
            const metric = (value, key) =>
              value && Number.isInteger(value[key]) ? value[key] : "unavailable";
            const clones = status.traffic_14d.clones;
            const views = status.traffic_14d.views;
            const trafficProvenance =
              status.traffic_14d.provenance || {};
            const ownerPool = status.owner_profile_pool;
            const moltbookPool = ownerPool.moltbook || {};
            const distribution = status.distribution_surfaces || {};
            const skillsSh = distribution.skills_sh || {};
            const githubSkillSearch =
              distribution.github_skill_search || {};
            const githubActionReferences =
              distribution.github_action_references || {};
            const publicProfileCardReferences =
              distribution.public_profile_card_references || {};
            const releaseSupplyChain =
              distribution.release_supply_chain || {};
            const claudeCommunity =
              distribution.claude_community || {};
            const agentPluginsDirectory =
              distribution.agent_plugins_directory || {};
            const agentSkillIndex =
              distribution.agent_skill_index || {};
            const aasCoreRelease =
              distribution.aas_core_release || {};
            const webDiscovery =
              distribution.web_discovery || {};
            const catalogPullRequests =
              distribution.catalog_pull_requests || [];
            const channelState = (channel) => {
              const item = catalogPullRequests.find(
                (entry) => entry.channel === channel
              );
              return item ? `${item.state} — ${item.url}` : "unavailable";
            };
            const skillsShState =
              skillsSh.listed === true
                ? "listed after at least one genuine install"
                : skillsSh.listed === false
                  ? "not listed yet"
                  : "unavailable";
            const githubSkillSearchState =
              githubSkillSearch.indexed === true
                ? "new owner-intent metadata indexed"
                : githubSkillSearch.indexed === false
                  ? "new metadata not indexed yet"
                  : "unavailable";
            const githubActionReferenceState =
              Number.isInteger(githubActionReferences.count)
                ? `${githubActionReferences.count} public workflow reference(s)`
                : "unavailable";
            const publicProfileCardReferenceState =
              Number.isInteger(publicProfileCardReferences.count)
                ? `${publicProfileCardReferences.count} public card marker(s)`
                : "unavailable";
            const latestReleaseState = releaseSupplyChain.latest_tag
              ? `${releaseSupplyChain.latest_tag} — ${
                  releaseSupplyChain.latest_immutable === true
                    ? "immutable"
                    : releaseSupplyChain.latest_immutable === false
                      ? "mutable release"
                      : "immutability unavailable"
                }`
              : "unavailable";
            const semverTagState =
              releaseSupplyChain.semver_tag_ruleset_active === true
                ? "active"
                : releaseSupplyChain.semver_tag_ruleset_active === false
                  ? "not active"
                  : "unavailable";
            const portableArchive =
              releaseSupplyChain.portable_skill_archive || {};
            const portableArchiveState =
              portableArchive.present === true
                ? `published — ${Number.isInteger(portableArchive.download_count) ? portableArchive.download_count : "unavailable"} aggregate download(s)`
                : portableArchive.present === false
                  ? "not attached to the latest release"
                  : "unavailable";
            const claudeCommunityState =
              claudeCommunity.state === "listed_expected_source"
                ? `listed from canonical source${
                    claudeCommunity.source_sha
                      ? ` at ${claudeCommunity.source_sha.slice(0, 7)}`
                      : ""
                  }`
                : claudeCommunity.state === "not_listed"
                  ? "not listed"
                  : claudeCommunity.state === "canonical_source_unpinned"
                    ? "canonical source without a valid SHA pin — not counted"
                  : claudeCommunity.state === "name_conflict"
                    ? "name conflict — not FindMate"
                    : "unavailable";
            const webDiscoveryState =
              webDiscovery.live === true
                ? "live canonical + robots + sitemap + llms + digest-bound skill index"
                : webDiscovery.live === false
                  ? "not fully live"
                  : "unavailable";
            const agentPluginsDirectoryState =
              agentPluginsDirectory.state === "listed_expected_source"
                ? `listed from canonical source${
                    agentPluginsDirectory.source_commit_sha
                      ? ` at ${agentPluginsDirectory.source_commit_sha.slice(0, 7)}`
                      : ""
                  }`
                : agentPluginsDirectory.state === "submission_open"
                  ? `submission open — ${agentPluginsDirectory.submission_url}`
                  : agentPluginsDirectory.state === "integration_pr_open"
                    ? `integration PR open — ${agentPluginsDirectory.integration_pull_request_url}`
                    : agentPluginsDirectory.state === "merged_pending_catalog"
                      ? "integration PR merged; awaiting daily catalog"
                      : agentPluginsDirectory.state === "integration_pr_closed_not_listed"
                        ? "integration PR closed; not present in daily catalog"
                  : agentPluginsDirectory.state === "submission_closed_not_listed"
                    ? "submission closed; not present in daily catalog"
                    : agentPluginsDirectory.state === "canonical_source_unverified"
                      ? "canonical source present without verified path and commit"
                      : agentPluginsDirectory.state === "name_conflict"
                        ? "name conflict — not FindMate"
                        : agentPluginsDirectory.state === "not_listed"
                          ? "not listed"
                          : "unavailable";
            const aasCoreReleaseState =
              aasCoreRelease.state === "included_expected_source"
                ? `included in ${aasCoreRelease.latest_tag}`
                : aasCoreRelease.state === "not_in_latest_release"
                  ? `not yet included in ${aasCoreRelease.latest_tag}`
                  : aasCoreRelease.state === "unexpected_source"
                    ? `unexpected source at ${aasCoreRelease.latest_tag}`
                    : "unavailable";
            const agentSkillIndexState =
              agentSkillIndex.state === "listed_expected_source"
                ? "listed from the canonical skill source"
                : agentSkillIndex.state === "not_listed"
                  ? "not listed yet"
                  : "unavailable";
            const moltbookPoolState =
              moltbookPool.available === true
                ? `${moltbookPool.comment_nodes} comment node(s); ${moltbookPool.external_current_marked_own_owner_submissions} current external own-owner marker(s)`
                : "unavailable";
            const moltbookEligibilityState =
              Number.isInteger(moltbookPool.eligible_external_profiles)
                ? `${moltbookPool.eligible_external_profiles} eligible external profile(s)`
                : moltbookPool.state === "external_markers_require_local_validation"
                  ? "external marker(s) awaiting local profile validation"
                  : moltbookPool.state === "truncated"
                    ? "unavailable — bounded response was truncated"
                    : "unavailable";
            const stopLine = promotion.stopped
              ? "STOPPED — the repository is above 100 stars. Active star requests must remain off."
              : `ACTIVE — ${promotion.stars_until_stop} star(s) remain before the stop state at 101.`;
            const body = [
              "# FindMate ethical growth ledger",
              "",
              `Last measured: ${status.observed_at}`,
              "",
              `- Stars: **${status.stars}** (${status.star_delta_from_baseline >= 0 ? "+" : ""}${status.star_delta_from_baseline} from baseline)`,
              `- Promotion state: **${stopLine}**`,
              `- 14-day clones: **${metric(clones, "count")}** total / **${metric(clones, "uniques")}** unique — directional infrastructure diagnostic, not external adoption`,
              `- Repository-owned Actions in the same window: **${Number.isInteger(trafficProvenance.repository_action_runs) ? trafficProvenance.repository_action_runs : "unavailable"}**; clone attribution: **${trafficProvenance.clone_signal_state === "confounded_by_repository_actions" ? "confounded" : "unavailable"}**`,
              `- 14-day views: **${metric(views, "count")}** total / **${metric(views, "uniques")}** unique`,
              `- GitHub marked own-owner submissions: **${ownerPool.github_marked_own_owner_submissions ?? "unavailable"}**`,
              `- GitHub submission sources: **${ownerPool.github_inline_sources ?? "unavailable"} inline / ${ownerPool.github_linked_sources ?? "unavailable"} linked**`,
              `- Machine-validated current GitHub admissions: **${ownerPool.github_machine_validated_current_receipts ?? "unavailable"}**`,
              `- Moltbook current marked external own-owner submissions: **${moltbookPoolState}**`,
              `- Moltbook eligibility status: **${moltbookEligibilityState}**`,
              `- skills.sh directory: **${skillsShState}**`,
              `- GitHub Skill search: **${githubSkillSearchState}**`,
              `- External GitHub Action references: **${githubActionReferenceState}**`,
              `- External public profile cards: **${publicProfileCardReferenceState}**`,
              `- Latest skill release: **${latestReleaseState}**`,
              `- Portable ChatGPT archive: **${portableArchiveState}**`,
              `- Semver tag protection: **${semverTagState}**`,
              `- Anthropic Claude community marketplace: **${claudeCommunityState}**`,
              `- Agent Plugins Directory: **${agentPluginsDirectoryState}**`,
              `- Agent Skill Index: **${agentSkillIndexState}**`,
              `- Public web discovery layer: **${webDiscoveryState}**`,
              `- Awesome Copilot catalog PR: **${channelState("awesome_copilot")}**`,
              `- OpenHands registry PR: **${channelState("openhands_extensions")}**`,
              `- AAS Core catalog PR: **${channelState("aas_core")}**`,
              `- AAS proactive-owner update PR: **${channelState("aas_proactive_update")}**`,
              `- Agent Skill Index PR: **${channelState("agent_skill_index")}**`,
              `- AAS Core released catalog: **${aasCoreReleaseState}**`,
              "",
              "## Active experiments",
              "",
              ...(active.length
                ? active.map((item) => `- ${item.id}: ${item.name} — metric: ${item.primary_metric}`)
                : ["- No active experiments."]),
              "",
              "## Latest recorded evidence",
              "",
              ...observations.flatMap((item) => [
                `- **${item.id} · ${item.kind} · ${item.observed_at}**`,
                `  - ${item.inference}`,
                `  - Decision: ${item.decision}`
              ]),
              "",
              "This workflow reads aggregate GitHub metrics plus one bounded canonical Moltbook thread and updates this one issue. It discards Moltbook comment text, authors, profile URLs, and hashes after classification; it never stars, messages, follows, or posts promotion. No owner-level telemetry is collected.",
              "",
              "Plan and guardrails: [growth/README.md](https://github.com/merc1305/findMate/blob/main/growth/README.md)"
            ].join("\n");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Growth loop: useful owner matching to 101 stars";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const existing = issues.find(
              (item) => !item.pull_request && item.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
                state: promotion.stopped ? "closed" : "open",
                state_reason: promotion.stopped ? "completed" : undefined
              });
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body
              });
              if (promotion.stopped) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: created.data.number,
                  state: "closed",
                  state_reason: "completed"
                });
              }
            }
      - name: Upload measurement artifact
        uses: actions/upload-artifact@v7
        with:
          name: star-growth-status
          path: growth-status.json
          retention-days: 30
