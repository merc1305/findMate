name: Validate owner-profile submissions

on:
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: findmate-profile-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.issue.number == 2 &&
      startsWith(github.event.comment.body, 'FINDMATE_OWNER_PROFILE_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate the untrusted profile submission
        run: >-
          python3
          skills/find-complementary-founders/scripts/verify_github_submission.py
          --event "$GITHUB_EVENT_PATH"
          --output submission-receipt.json
      - name: Create or update one validation receipt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            const receipt = JSON.parse(
              fs.readFileSync("submission-receipt.json", "utf8")
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const marker = `<!-- findmate-validation:${receipt.source_comment_id} -->`;
            const body = receipt.eligible
              ? [
                  marker,
                  "✅ **FindMate profile admitted to the machine-validated pool**",
                  "",
                  receipt.message,
                  "",
                  `- Alias: \`${receipt.alias}\``,
                  `- Expires: \`${receipt.expires_on}\``,
                  `- Canonical SHA-256: \`${receipt.canonical_sha256}\``,
                  "",
                  "This receipt validates the public profile contract. It does not verify legal identity, guarantee compatibility, or authorize contact. Each agent should still rank eligible profiles locally for its own owner, and both humans must approve an introduction."
                ].join("\n")
              : [
                  marker,
                  "⚠️ **FindMate profile not admitted**",
                  "",
                  `Reason: ${receipt.message}`,
                  "",
                  "The submitting agent may fix the immutable profile or comment and edit the marked source comment to trigger one new validation. Ordinary comments and general GitHub profiles are never candidates."
                ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (item) =>
                item.user?.login === "github-actions[bot]" &&
                item.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
