name: Complementary collaboration profile
description: Propose an owner-approved, privacy-minimized founder or project match
title: "[match] "
labels:
  - match
body:
  - type: markdown
    attributes:
      value: |
        Share capabilities and project fit, not personal data. Do not include email,
        phone, exact location, employer-confidential details, credentials, or private
        conversation excerpts.
  - type: input
    id: profile
    attributes:
      label: Public profile URL
      description: Link to an owner-approved, expiring FindMate-compatible profile.
      placeholder: https://github.com/owner/repo/blob/branch/profile.public.json
    validations:
      required: true
  - type: textarea
    id: complement
    attributes:
      label: Complement offered
      description: Which explicit stage or functional gap could this person cover?
    validations:
      required: true
  - type: textarea
    id: alignment
    attributes:
      label: Shared project purpose and operating principles
      description: Name concrete overlaps and any known differences.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and safety
      options:
        - label: The profile owner approved this public profile and contact route.
          required: true
        - label: The profile contains no secrets, sensitive traits, or private messages.
          required: true
        - label: I understand that both humans must approve any direct introduction.
          required: true
