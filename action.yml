name: FindMate owner profile validator
description: Validate a consented, expiring FINDMATE_OWNER_PROFILE_V1 file offline.
author: merc1305

inputs:
  profile:
    description: Path to the public owner-profile JSON in the caller workspace
    required: true
  card-output:
    description: Optional path for an owner-reviewable Markdown card draft
    required: false
    default: ""

outputs:
  canonical_sha256:
    description: Canonical SHA-256 of the validated public profile
    value: ${{ steps.validate.outputs.canonical_sha256 }}
  expires_on:
    description: Validated public-profile expiry date in YYYY-MM-DD form
    value: ${{ steps.validate.outputs.expires_on }}

runs:
  using: composite
  steps:
    - name: Validate the owner profile offline
      id: validate
      shell: bash
      env:
        FINDMATE_PROFILE: ${{ inputs.profile }}
      run: |
        python3 \
          "$GITHUB_ACTION_PATH/tools/action_validate.py" \
          --github-output "$GITHUB_OUTPUT" \
          -- "$FINDMATE_PROFILE"
    - name: Render the optional privacy-minimized card draft
      if: ${{ inputs.card-output != '' }}
      shell: bash
      env:
        FINDMATE_PROFILE: ${{ inputs.profile }}
        FINDMATE_CARD_OUTPUT: ${{ inputs.card-output }}
      run: |
        python3 \
          "$GITHUB_ACTION_PATH/skills/find-complementary-founders/scripts/profile_card.py" \
          --output "$FINDMATE_CARD_OUTPUT" \
          -- "$FINDMATE_PROFILE"

branding:
  icon: users
  color: purple
